<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Funil Tracker</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    width: 380px;
    max-height: 560px;
    overflow-y: auto;
    background: #0a0a0a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
  }

  header {
    position: sticky;
    top: 0;
    background: #0a0a0a;
    border-bottom: 1px solid rgba(0, 212, 255, 0.25);
    padding: 12px 14px 10px;
    z-index: 1;
  }

  h1 {
    margin: 0 0 10px;
    font-size: 14px;
    font-weight: 700;
    color: #00d4ff;
    letter-spacing: .02em;
  }

  #input-data {
    background: #141414;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 6px;
    color: #fff;
    font-size: 12px;
    padding: 5px 8px;
    color-scheme: dark;
  }

  #resumo {
    padding: 10px 14px;
    font-size: 11px;
    color: #888;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  #lista-analises {
    padding: 10px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card {
    background: #111;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 8px 10px;
  }

  .card-topo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }

  .card-dominio {
    font-weight: 700;
    font-size: 12px;
    word-break: break-all;
  }

  .card-hora {
    font-size: 11px;
    color: #888;
    white-space: nowrap;
  }

  .card-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 6px;
  }

  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    border-radius: 8px;
    padding: 3px 8px;
    cursor: default;
  }

  a.badge {
    cursor: pointer;
  }

  .card-links {
    font-size: 11px;
    color: #888;
  }

  .vazio, .carregando, .erro {
    text-align: center;
    color: #888;
    font-size: 12px;
    padding: 24px 8px;
  }

  .erro { color: #ff6b6b; }
</style>
</head>
<body>
  <header>
    <h1>⚡ Funil Tracker — Relatório de hoje</h1>
    <input type="date" id="input-data">
  </header>
  <div id="resumo"></div>
  <div id="lista-analises"></div>

  <script src="supabase-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
