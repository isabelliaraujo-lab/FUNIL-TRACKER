<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Relatório — Spy Nativo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;
  --border:#ffffff0f;--border2:#ffffff18;
  --text:#f0f0f5;--muted:#707088;
  --accent:#c8ff57;--accent2:#7c6fff;--danger:#ff5757;--gold:#fbbf24;
  --wl:#378ADD;--db:#639922;--ml:#7F77DD;--pt:#BA7517;
  --da:#1D9E75;--ed:#E24B4A;--np:#D85A30;--vl:#D4537E;--rj:#888780;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── APP TABS ── */
.app-nav{display:flex;gap:0;border-bottom:0.5px solid var(--border2);background:var(--bg2);position:sticky;top:0;z-index:100}
.app-tab{padding:14px 28px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s;letter-spacing:.03em}
.app-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.app-tab:hover:not(.active){color:var(--text)}
.app-panel{display:none}.app-panel.active{display:block}

/* ── SHARED ── */
.page-wrap{max-width:860px;margin:0 auto;padding:40px 24px 80px}
.form-header{margin-bottom:36px;border-bottom:0.5px solid var(--border2);padding-bottom:24px}
.eyebrow{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.15em;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
h1{font-family:'DM Serif Display',serif;font-size:clamp(26px,5vw,40px);font-weight:400;line-height:1.1;margin-bottom:6px}
.form-header p{font-size:13px;color:var(--muted);line-height:1.6}
.field-label{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.field-group{display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=date],input[type=url],textarea,select{background:var(--bg2);border:0.5px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Syne',sans-serif;font-size:13px;padding:10px 13px;width:100%;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent2)}
textarea{resize:vertical;min-height:68px}
select option{background:#1a1a24}
.meta-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}
.section-sub{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;margin-top:18px}
.section-sub:first-of-type{margin-top:0}
.btn-generate{width:100%;padding:16px;background:var(--accent);border:none;border-radius:12px;color:#0a0a0f;font-family:'Syne',sans-serif;font-size:14px;font-weight:800;cursor:pointer;margin-top:28px;letter-spacing:.03em;transition:opacity .15s,transform .1s}
.btn-generate:hover{opacity:.9;transform:translateY(-1px)}

/* ── NICHO PICKER ── */
.nicho-picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.nicho-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--bg2);color:var(--muted);font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:.05em}
.nicho-btn:hover{border-color:#ffffff33;color:var(--text)}
.nicho-btn.active{color:#fff;border-color:transparent}
.nicho-btn[data-nicho=WL].active{background:var(--wl)}
.nicho-btn[data-nicho=DB].active{background:var(--db)}
.nicho-btn[data-nicho=ML].active{background:var(--ml)}
.nicho-btn[data-nicho=PT].active{background:var(--pt)}
.nicho-btn[data-nicho=DA].active{background:var(--da)}
.nicho-btn[data-nicho=ED].active{background:var(--ed)}
.nicho-btn[data-nicho=NP].active{background:var(--np)}
.nicho-btn[data-nicho=VL].active{background:var(--vl)}
.nicho-btn[data-nicho=RJ].active{background:var(--rj)}

/* ── NICHO SECTION (semanal) ── */
.nicho-section{background:var(--bg2);border:0.5px solid var(--border2);border-radius:14px;padding:22px;margin-bottom:18px}
.nicho-section-header{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-bottom:14px;border-bottom:0.5px solid var(--border)}
.nicho-badge-big{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.nicho-section-header h3{font-size:15px;font-weight:700;flex:1}

/* ── AD ITEM ── */
.ad-item{background:var(--bg3);border:0.5px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px}
.ad-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ad-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)}
.btn-remove-ad{background:none;border:none;color:var(--danger);cursor:pointer;font-size:15px;opacity:.4;transition:opacity .15s;padding:0 4px}
.btn-remove-ad:hover{opacity:1}
.ad-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.ad-flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.flag-btn{padding:4px 11px;border-radius:20px;border:1px solid var(--border2);background:none;color:var(--muted);font-family:'Syne',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.flag-btn.on{background:rgba(200,255,87,.1);border-color:var(--accent);color:var(--accent)}
.flag-btn.lateral.on{background:rgba(124,111,255,.1);border-color:var(--accent2);color:var(--accent2)}
.flag-btn.famoso.on{background:rgba(251,191,36,.1);border-color:var(--gold);color:var(--gold)}
.btn-add-ad{width:100%;padding:9px;border:1px dashed var(--border2);border-radius:8px;background:none;color:var(--muted);font-family:'Syne',sans-serif;font-size:12px;cursor:pointer;transition:all .15s;margin-top:4px}
.btn-add-ad:hover{border-color:var(--accent2);color:var(--accent2)}

/* ── LINK ROWS ── */
.link-list{display:flex;flex-direction:column;gap:8px}
.link-row{display:flex;gap:8px;align-items:center}
.link-row input{flex:1}
.link-row input[placeholder*="Label"]{max-width:150px}
.btn-add-link{background:none;border:1px dashed var(--border2);border-radius:6px;color:var(--muted);font-family:'Syne',sans-serif;font-size:11px;cursor:pointer;padding:7px 12px;transition:all .15s;margin-top:4px;width:100%}
.btn-add-link:hover{border-color:var(--accent2);color:var(--accent2)}
.btn-remove-link{background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px;opacity:.4;transition:opacity .15s;flex-shrink:0}
.btn-remove-link:hover{opacity:1}

/* ── REPORT ACTIONS ── */
.report-actions{display:flex;gap:10px;margin-bottom:36px;flex-wrap:wrap}
.btn-back{padding:10px 20px;border:1px solid var(--border2);border-radius:8px;background:none;color:var(--text);font-family:'Syne',sans-serif;font-size:13px;cursor:pointer;transition:border-color .15s}
.btn-back:hover{border-color:#ffffff44}
.btn-copy-report{padding:10px 20px;border:1px solid var(--accent);border-radius:8px;background:rgba(200,255,87,.08);color:var(--accent);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-copy-report:hover{background:rgba(200,255,87,.16)}
.btn-print{padding:10px 20px;border:1px solid var(--accent2);border-radius:8px;background:rgba(124,111,255,.08);color:var(--accent2);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-print:hover{background:rgba(124,111,255,.16)}

/* ── REPORT OUTPUT ── */
.report-masthead{border-bottom:0.5px solid var(--border2);padding-bottom:28px;margin-bottom:36px}
.report-title{font-family:'DM Serif Display',serif;font-size:clamp(30px,6vw,50px);font-weight:400;line-height:1.05;margin-bottom:8px}
.report-meta{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
.report-nicho{margin-bottom:48px;page-break-inside:avoid}
.report-nicho-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border2)}
.report-nicho-badge{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.report-nicho-title{font-family:'DM Serif Display',serif;font-size:24px;font-weight:400}
.report-nicho-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-left:auto;letter-spacing:.05em}
.report-resumo{background:var(--bg2);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:14px 18px;margin-bottom:24px;font-size:14px;line-height:1.7;color:#d0d0e0}
.report-nicho-alta{display:inline-flex;align-items:center;gap:6px;background:rgba(200,255,87,.08);border:1px solid rgba(200,255,87,.2);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:20px}
.report-section-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.report-section-label::after{content:'';flex:1;height:0.5px;background:var(--border2)}
.report-ad{display:flex;gap:12px;padding:14px 0;border-bottom:0.5px solid var(--border);align-items:flex-start}
.report-ad:last-child{border-bottom:none}
.report-ad-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);font-weight:500;min-width:22px;padding-top:2px}
.report-ad-body{flex:1;min-width:0}
.report-ad-context{font-size:14px;line-height:1.6;color:var(--text);margin-bottom:6px}
.report-ad-flags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.report-flag{padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.04em}
.report-flag.swipe{background:rgba(200,255,87,.12);color:var(--accent)}
.report-flag.lateral{background:rgba(124,111,255,.12);color:var(--accent2)}
.report-flag.famoso{background:rgba(251,191,36,.12);color:var(--gold)}
.report-ad-link{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent2);word-break:break-all;text-decoration:none;display:inline-block}
.report-ad-link:hover{text-decoration:underline}
.report-funil{background:var(--bg2);border:0.5px solid var(--border2);border-radius:12px;padding:18px;margin-bottom:10px}
.report-funil-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.report-headline{font-family:'DM Serif Display',serif;font-size:16px;line-height:1.4;color:var(--text);margin-bottom:10px;font-style:italic}
.report-link-row{display:flex;align-items:center;gap:8px;margin-top:7px}
.report-link-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;flex-shrink:0}
.report-link{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent2);word-break:break-all;text-decoration:none}
.report-link:hover{text-decoration:underline}
.report-obs{font-size:13px;line-height:1.7;color:var(--muted);padding:12px 16px;border:0.5px dashed var(--border2);border-radius:10px;margin-bottom:8px}

/* ── DIÁRIO ── */
.diario-card{background:var(--bg2);border:0.5px solid var(--border2);border-radius:14px;padding:22px;margin-bottom:18px}
.diario-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.fonte-picker{display:flex;gap:8px;flex-wrap:wrap}
.fonte-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--bg2);color:var(--muted);font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.fonte-btn.active{background:var(--accent2);border-color:var(--accent2);color:#fff}
.janela-block{background:var(--bg3);border:0.5px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px}
.janela-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.janela-icon{font-size:20px}
.janela-title{font-size:14px;font-weight:700}
.janela-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nicho-count-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nicho-count-item{display:flex;align-items:center;gap:5px}
.nicho-count-input{width:52px;padding:4px 6px;text-align:center;border-radius:6px;font-size:12px}
.nicho-count-label{font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;color:#fff}

/* ── REPORT DIÁRIO OUTPUT ── */
.daily-report-output{font-family:'DM Mono',monospace;background:var(--bg2);border:0.5px solid var(--border2);border-radius:12px;padding:24px;white-space:pre-wrap;font-size:13px;line-height:1.8;color:var(--text)}
.daily-copy-btn{width:100%;margin-top:12px;padding:12px;background:none;border:1px solid var(--accent);border-radius:8px;color:var(--accent);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.daily-copy-btn:hover{background:rgba(200,255,87,.08)}

@media print{
  body{background:#fff;color:#111}
  .app-nav,.report-actions,.app-panel:not(#panel-semanal){display:none!important}
  #panel-semanal{display:block!important}
  #report-semanal-form{display:none!important}
  #report-semanal-output{display:block!important}
  :root{--bg:#fff;--bg2:#f5f5f5;--bg3:#eee;--text:#111;--muted:#666;--border2:#ddd;--accent:#3a8a00;--accent2:#3a3aff}
}
</style>
</head>
<body>

<!-- ══ APP NAV ══ -->
<nav class="app-nav">
  <button class="app-tab active" data-panel="diario">📊 Diário</button>
  <button class="app-tab" data-panel="semanal">📋 Semanal</button>
</nav>

<!-- ══════════════ PAINEL DIÁRIO ══════════════ -->
<div class="app-panel active" id="panel-diario">
<div class="page-wrap">
  <div class="form-header">
    <div class="eyebrow">⚡ Funil Tracker</div>
    <h1>Relatório<br><em style="font-style:italic;color:var(--muted)">Diário</em></h1>
    <p>Preencha as janelas de mineração do dia. O relatório é gerado no formato para colar no grupo.</p>
  </div>

  <div class="meta-row" style="grid-template-columns:1fr 1fr 1fr">
    <div class="field-group">
      <label class="field-label">Data</label>
      <input type="date" id="d-data"/>
    </div>
    <div class="field-group">
      <label class="field-label">Responsável</label>
      <input type="text" id="d-resp" placeholder="Ex: Samuel"/>
    </div>
    <div class="field-group">
      <label class="field-label">Fonte</label>
      <div class="fonte-picker" id="fonte-picker">
        <button class="fonte-btn active" data-fonte="NATIVE">NATIVE</button>
        <button class="fonte-btn" data-fonte="FACEBOOK">FACEBOOK</button>
        <button class="fonte-btn" data-fonte="YOUTUBE">YOUTUBE</button>
      </div>
    </div>
  </div>

  <!-- Janelas -->
  <div id="janelas-container"></div>

  <button class="btn-generate" onclick="generateDaily()">⚡ Gerar Relatório Diário</button>

  <!-- Output -->
  <div id="daily-output" style="display:none;margin-top:28px">
    <div class="section-sub">Relatório gerado</div>
    <div class="daily-report-output" id="daily-text"></div>
    <button class="daily-copy-btn" onclick="copyDaily()">⎘ Copiar para WhatsApp / ClickUp</button>
  </div>
</div>
</div>

<!-- ══════════════ PAINEL SEMANAL ══════════════ -->
<div class="app-panel" id="panel-semanal">

  <!-- FORM -->
  <div id="report-semanal-form">
  <div class="page-wrap">
    <div class="form-header">
      <div class="eyebrow">⚡ Funil Tracker</div>
      <h1>Relatório<br><em style="font-style:italic;color:var(--muted)">Semanal</em></h1>
      <p>Preencha os dados da semana por nicho. O relatório é gerado automaticamente.</p>
    </div>

    <div class="meta-row">
      <div class="field-group">
        <label class="field-label">Semana (de)</label>
        <input type="date" id="meta-de"/>
      </div>
      <div class="field-group">
        <label class="field-label">Semana (até)</label>
        <input type="date" id="meta-ate"/>
      </div>
      <div class="field-group">
        <label class="field-label">Total de funis minerados</label>
        <input type="text" id="meta-total" placeholder="Ex: 54"/>
      </div>
      <div class="field-group">
        <label class="field-label">Responsável</label>
        <input type="text" id="meta-resp" placeholder="Ex: Isabelli"/>
      </div>
    </div>

    <div class="field-label" style="margin-bottom:10px">Selecione os nichos da semana</div>
    <div class="nicho-picker" id="nicho-picker">
      <button class="nicho-btn" data-nicho="WL">WL</button>
      <button class="nicho-btn" data-nicho="ML">ML</button>
      <button class="nicho-btn" data-nicho="DB">DB</button>
      <button class="nicho-btn" data-nicho="PT">PT</button>
      <button class="nicho-btn" data-nicho="DA">DA</button>
      <button class="nicho-btn" data-nicho="NP">NP</button>
      <button class="nicho-btn" data-nicho="ED">ED</button>
      <button class="nicho-btn" data-nicho="VL">VL</button>
      <button class="nicho-btn" data-nicho="RJ">RJ</button>
    </div>

    <div id="nicho-sections"></div>
    <button class="btn-generate" onclick="generateWeekly()">⚡ Gerar Relatório Semanal</button>
  </div>
  </div>

  <!-- OUTPUT -->
  <div id="report-semanal-output" style="display:none">
  <div class="page-wrap">
    <div class="report-actions">
      <button class="btn-back" onclick="backToWeeklyForm()">← Editar</button>
      <button class="btn-copy-report" onclick="copyWeekly()">⎘ Copiar para ClickUp</button>
      <button class="btn-print" onclick="window.print()">↓ Salvar PDF</button>
    </div>
    <div id="report-weekly-content"></div>
  </div>
  </div>

</div><!-- /panel-semanal -->

<script>
// ── UTILS ─────────────────────────────────────────────────────────────────
const NICHO_COLORS={WL:'#378ADD',ML:'#7F77DD',DB:'#639922',PT:'#BA7517',DA:'#1D9E75',ED:'#E24B4A',NP:'#D85A30',VL:'#D4537E',RJ:'#888780'};
const NICHO_NAMES={WL:'Weight Loss',ML:'Memória',DB:'Diabetes',PT:'Próstata',DA:'Dores',ED:'Disfunção Erétil',NP:'Nerve Pain',VL:'Visão',RJ:'Rejuvenescimento'};
const ALL_NICHOS=['WL','ML','DB','PT','DA','NP','ED','VL','RJ'];

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtDate(d){if(!d)return'';return new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'})}

// ── APP TABS ──────────────────────────────────────────────────────────────
document.querySelectorAll('.app-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.app-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.app-panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-'+tab.dataset.panel).classList.add('active');
  });
});

// ══════════════════════════════════════════════════════════════════════════
// DIÁRIO
// ══════════════════════════════════════════════════════════════════════════

const JANELAS=[
  {id:'manha',icon:'☀️',label:'MANHÃ'},
  {id:'tarde',icon:'🌤️',label:'TARDE'},
  {id:'noite',icon:'🌙',label:'NOITE'},
];

let dailyData={
  manha:{nichos:{},nichoAlta:'',feeling:''},
  tarde:{nichos:{},nichoAlta:'',feeling:''},
  noite:{nichos:{},nichoAlta:'',feeling:''},
};
let selectedFonte='NATIVE';

// Data padrão = hoje
document.getElementById('d-data').value=new Date().toISOString().slice(0,10);

// Fonte picker
document.querySelectorAll('.fonte-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.fonte-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    selectedFonte=btn.dataset.fonte;
  });
});

// Render janelas
function renderJanelas(){
  const c=document.getElementById('janelas-container');
  c.innerHTML=JANELAS.map(j=>`
    <div class="janela-block">
      <div class="janela-header">
        <span class="janela-icon">${j.icon}</span>
        <span class="janela-title">JANELA: ${j.label}</span>
      </div>
      <div class="janela-grid">
        <div class="field-group">
          <label class="field-label">📈 Nicho em Alta</label>
          <input type="text" placeholder="Ex: WL"
            value="${esc(dailyData[j.id].nichoAlta)}"
            onchange="dailyData['${j.id}'].nichoAlta=this.value"/>
        </div>
        <div class="field-group">
          <label class="field-label">💡 Seu Feeling</label>
          <input type="text" placeholder="Ex: mercado aquecido em ML"
            value="${esc(dailyData[j.id].feeling)}"
            onchange="dailyData['${j.id}'].feeling=this.value"/>
        </div>
      </div>
      <div class="field-label" style="margin-top:14px;margin-bottom:8px">🔻 Funis colhidos por nicho</div>
      <div class="nicho-count-row">
        ${ALL_NICHOS.map(n=>`
          <div class="nicho-count-item">
            <span class="nicho-count-label" style="background:${NICHO_COLORS[n]}">${n}</span>
            <input class="nicho-count-input" type="number" min="0" placeholder="0"
              value="${dailyData[j.id].nichos[n]||''}"
              onchange="dailyData['${j.id}'].nichos['${n}']=parseInt(this.value)||0"/>
          </div>
        `).join('')}
        <div class="nicho-count-item">
          <span class="nicho-count-label" style="background:#555">OUTROS</span>
          <input class="nicho-count-input" type="number" min="0" placeholder="0"
            value="${dailyData[j.id].nichos['OUTROS']||''}"
            onchange="dailyData['${j.id}'].nichos['OUTROS']=parseInt(this.value)||0"/>
        </div>
      </div>
    </div>
  `).join('');
}
renderJanelas();

function generateDaily(){
  const data=document.getElementById('d-data').value;
  const resp=document.getElementById('d-resp').value.trim()||'—';
  const dateFmt=fmtDate(data);

  let lines=[];
  lines.push(`📊 *MINERAÇÃO* | 🔗 FONTE: ${selectedFonte}`);
  lines.push(`👤 ${resp}  |  📅 ${dateFmt}`);
  lines.push('━━━━━━━━━━━━━━━━━━━━━━');

  let totalGeral={};

  JANELAS.forEach(j=>{
    const jd=dailyData[j.id];
    const allNichos=[...ALL_NICHOS,'OUTROS'];
    const nichoList=allNichos.filter(n=>(jd.nichos[n]||0)>0);
    const funisTxt=nichoList.length?nichoList.map(n=>`${n}(${jd.nichos[n]})`).join(' '):'—';

    // acumula total
    allNichos.forEach(n=>{
      if(jd.nichos[n]) totalGeral[n]=(totalGeral[n]||0)+jd.nichos[n];
    });

    lines.push(`${j.icon} *JANELA: ${j.label}*`);
    lines.push(`🔻 Funis Colhidos: ${funisTxt}`);
    lines.push(`📈 Nicho em Alta: ${jd.nichoAlta||'—'}`);
    lines.push(`💡 Seu Feeling: ${jd.feeling||''}`);
    lines.push('━━━━━━━━━━━━━━━━━━━━━━');
  });

  // Totais
  const totalEntries=Object.entries(totalGeral).sort((a,b)=>a[1]-b[1]);
  const totalStr=totalEntries.map(([n,v])=>`${n}(${v})`).join(' ');
  const totalFunis=Object.values(totalGeral).reduce((s,v)=>s+v,0);
  if(totalStr) lines.push(totalStr+`  total: ${totalFunis}`);
  lines.push('✅ *Mineração concluída!*');

  document.getElementById('daily-text').textContent=lines.join('\n');
  document.getElementById('daily-output').style.display='block';
  document.getElementById('daily-output').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function copyDaily(){
  const text=document.getElementById('daily-text').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.querySelector('.daily-copy-btn');
    const orig=btn.textContent;
    btn.textContent='✓ Copiado!';
    setTimeout(()=>btn.textContent=orig,2000);
  }).catch(()=>{
    const range=document.createRange();
    range.selectNode(document.getElementById('daily-text'));
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand('copy');
    window.getSelection().removeAllRanges();
  });
}

// ══════════════════════════════════════════════════════════════════════════
// SEMANAL
// ══════════════════════════════════════════════════════════════════════════

let activeNichos=[];
let nichoData={};

document.querySelectorAll('.nicho-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const n=btn.dataset.nicho;
    if(btn.classList.contains('active')){
      btn.classList.remove('active');
      activeNichos=activeNichos.filter(x=>x!==n);
    } else {
      btn.classList.add('active');
      activeNichos.push(n);
      if(!nichoData[n]) nichoData[n]={funis:'',nichoAlta:'',resumo:'',ads:[],headline:'',vsls:[],templates:[],obs:''};
    }
    renderNichoSections();
  });
});

function renderNichoSections(){
  const container=document.getElementById('nicho-sections');
  container.innerHTML='';
  activeNichos.forEach(n=>{
    const d=nichoData[n];
    const color=NICHO_COLORS[n];
    const section=document.createElement('div');
    section.className='nicho-section';
    section.dataset.nicho=n;
    section.innerHTML=`
      <div class="nicho-section-header">
        <div class="nicho-badge-big" style="background:${color}">${n}</div>
        <h3>${NICHO_NAMES[n]}</h3>
      </div>
      <div class="section-sub">Resumo</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div class="field-group">
          <label class="field-label">Qtd de funis minerados</label>
          <input type="text" placeholder="Ex: 18" value="${esc(d.funis)}"
            onchange="setNichoField('${n}','funis',this.value)"/>
        </div>
        <div class="field-group">
          <label class="field-label">📈 Nicho em Alta (semana)</label>
          <input type="text" placeholder="Ex: WL foi o mais quente"
            value="${esc(d.nichoAlta)}"
            onchange="setNichoField('${n}','nichoAlta',this.value)"/>
        </div>
      </div>
      <div class="field-group" style="margin-bottom:4px">
        <label class="field-label">Texto do resumo</label>
        <textarea placeholder="Ex: Prevalência de SLIMTIDE (6 funis) e JELLY LEAN (4)…"
          onchange="setNichoField('${n}','resumo',this.value)">${esc(d.resumo)}</textarea>
      </div>
      <div class="section-sub" style="margin-top:18px">Ads em destaque</div>
      <div class="ad-list" id="ads-${n}"></div>
      <button class="btn-add-ad" onclick="addAd('${n}')">+ Adicionar ad</button>
      <div class="section-sub" style="margin-top:18px">Funil em destaque</div>
      <div class="field-group" style="margin-bottom:10px">
        <label class="field-label">Headline campeã</label>
        <textarea rows="2" placeholder="Ex: Yale Doctor Reveals…"
          onchange="setNichoField('${n}','headline',this.value)">${esc(d.headline)}</textarea>
      </div>
      <div class="section-sub">VSLs</div>
      <div class="link-list" id="vsls-${n}"></div>
      <button class="btn-add-link" onclick="addLink('${n}','vsls')">+ Adicionar VSL</button>
      <div class="section-sub" style="margin-top:12px">Templates</div>
      <div class="link-list" id="templates-${n}"></div>
      <button class="btn-add-link" onclick="addLink('${n}','templates')">+ Adicionar template</button>
      <div class="section-sub" style="margin-top:18px">Observações gerais</div>
      <textarea placeholder="Qualquer insight adicional…"
        onchange="setNichoField('${n}','obs',this.value)">${esc(d.obs)}</textarea>
    `;
    container.appendChild(section);
    renderAds(n);
    renderLinks(n,'vsls');
    renderLinks(n,'templates');
  });
}

function setNichoField(nicho,field,value){nichoData[nicho][field]=value}

// Ads
function addAd(nicho){nichoData[nicho].ads.push({link:'',context:'',swipe:false,lateral:false,famoso:false});renderAds(nicho)}
function removeAd(nicho,idx){nichoData[nicho].ads.splice(idx,1);renderAds(nicho)}
function setAdField(nicho,idx,field,value){nichoData[nicho].ads[idx][field]=value}
function toggleAdFlag(nicho,idx,flag){nichoData[nicho].ads[idx][flag]=!nichoData[nicho].ads[idx][flag];renderAds(nicho)}

function renderAds(nicho){
  const container=document.getElementById(`ads-${nicho}`);
  if(!container)return;
  container.innerHTML=nichoData[nicho].ads.map((ad,i)=>`
    <div class="ad-item">
      <div class="ad-item-header">
        <span class="ad-num">AD ${i+1}</span>
        <button class="btn-remove-ad" onclick="removeAd('${nicho}',${i})">✕</button>
      </div>
      <div class="ad-grid">
        <div class="field-group" style="grid-column:1/-1">
          <label class="field-label">Link do anúncio</label>
          <input type="url" placeholder="https://facebook.com/… ou swipe.groupwave…"
            value="${esc(ad.link)}" onchange="setAdField('${nicho}',${i},'link',this.value)"/>
        </div>
        <div class="field-group" style="grid-column:1/-1">
          <label class="field-label">Contexto / por que esse ad</label>
          <textarea rows="2" placeholder="Ex: hook visual de tapa na cara, 154k views…"
            onchange="setAdField('${nicho}',${i},'context',this.value)">${esc(ad.context)}</textarea>
        </div>
      </div>
      <div class="ad-flags">
        <button class="flag-btn ${ad.swipe?'on':''}" onclick="toggleAdFlag('${nicho}',${i},'swipe')">${ad.swipe?'✓ ':''} No Swipe</button>
        <button class="flag-btn lateral ${ad.lateral?'on':''}" onclick="toggleAdFlag('${nicho}',${i},'lateral')">${ad.lateral?'✓ ':''} Lateralizado</button>
        <button class="flag-btn famoso ${ad.famoso?'on':''}" onclick="toggleAdFlag('${nicho}',${i},'famoso')">${ad.famoso?'✓ ':''} Com famoso</button>
      </div>
    </div>
  `).join('');
}

// Links
function addLink(nicho,type){nichoData[nicho][type].push({url:'',label:''});renderLinks(nicho,type)}
function removeLink(nicho,type,idx){nichoData[nicho][type].splice(idx,1);renderLinks(nicho,type)}
function setLinkField(nicho,type,idx,field,value){nichoData[nicho][type][idx][field]=value}

function renderLinks(nicho,type){
  const container=document.getElementById(`${type}-${nicho}`);
  if(!container)return;
  container.innerHTML=nichoData[nicho][type].map((item,i)=>`
    <div class="link-row">
      <input type="text" placeholder="Label (ex: VSL Vencedora)" value="${esc(item.label)}"
        onchange="setLinkField('${nicho}','${type}',${i},'label',this.value)" style="max-width:150px"/>
      <input type="url" placeholder="https://…" value="${esc(item.url)}"
        onchange="setLinkField('${nicho}','${type}',${i},'url',this.value)"/>
      <button class="btn-remove-link" onclick="removeLink('${nicho}','${type}',${i})">✕</button>
    </div>
  `).join('');
}

// Generate weekly
function generateWeekly(){
  const de=document.getElementById('meta-de').value;
  const ate=document.getElementById('meta-ate').value;
  const total=document.getElementById('meta-total').value;
  const resp=document.getElementById('meta-resp').value;

  let html=`
    <div class="report-masthead">
      <div class="eyebrow">⚡ Spy Nativo — Relatório Semanal</div>
      <div class="report-title">Overview<br><em style="font-style:italic;color:var(--muted)">da Semana</em></div>
      <div class="report-meta">
        ${de||ate?`<span>📅 ${fmtDate(de)}${ate?' – '+fmtDate(ate):''}</span>`:''}
        ${total?`<span>🔍 ${esc(total)} funis minerados</span>`:''}
        ${resp?`<span>👤 ${esc(resp)}</span>`:''}
        <span>📊 ${activeNichos.length} nicho(s)</span>
      </div>
    </div>
  `;

  activeNichos.forEach(n=>{
    const d=nichoData[n];
    const color=NICHO_COLORS[n];
    const hasAds=d.ads.length>0;
    const hasVsls=d.vsls.filter(v=>v.url).length>0;
    const hasTemplates=d.templates.filter(t=>t.url).length>0;
    const hasFunil=d.headline||hasVsls||hasTemplates;

    html+=`<div class="report-nicho">`;
    html+=`
      <div class="report-nicho-header">
        <div class="report-nicho-badge" style="background:${color}">${n}</div>
        <div class="report-nicho-title">${NICHO_NAMES[n]}</div>
        ${d.funis?`<div class="report-nicho-count">${esc(d.funis)} funis</div>`:''}
      </div>
    `;

    // Nicho em alta badge
    if(d.nichoAlta){
      html+=`<div style="margin-bottom:16px"><span class="report-nicho-alta">📈 Em alta: ${esc(d.nichoAlta)}</span></div>`;
    }

    // Resumo
    if(d.resumo||d.funis){
      const auto=d.funis?`Ao todo foram ${esc(d.funis)} funis ${n} minerados na semana${d.resumo?'. ':'.'}`:' ';
      html+=`<div class="report-resumo">${auto}${esc(d.resumo)}</div>`;
    }

    // Ads
    if(hasAds){
      html+=`<div class="report-section-label">Ads em destaque</div>`;
      d.ads.forEach((ad,i)=>{
        if(!ad.link&&!ad.context)return;
        html+=`
          <div class="report-ad">
            <div class="report-ad-num">${String(i+1).padStart(2,'0')}</div>
            <div class="report-ad-body">
              ${ad.context?`<div class="report-ad-context">${esc(ad.context)}</div>`:''}
              <div class="report-ad-flags">
                ${ad.swipe?'<span class="report-flag swipe">✓ No Swipe</span>':''}
                ${ad.lateral?'<span class="report-flag lateral">🔄 Lateralizado</span>':''}
                ${ad.famoso?'<span class="report-flag famoso">⭐ Com famoso</span>':''}
              </div>
              ${ad.link?`<a href="${esc(ad.link)}" class="report-ad-link" target="_blank">${esc(ad.link)}</a>`:''}
            </div>
          </div>
        `;
      });
    }

    // Funil
    if(hasFunil){
      html+=`<div class="report-section-label" style="margin-top:22px">Funil em destaque</div>`;
      html+=`<div class="report-funil">`;
      if(d.headline) html+=`<div class="report-funil-label">Headline campeã</div><div class="report-headline">"${esc(d.headline)}"</div>`;
      d.vsls.filter(v=>v.url).forEach(v=>{
        html+=`<div class="report-link-row"><span class="report-link-label">${esc(v.label||'VSL')}</span><a href="${esc(v.url)}" class="report-link" target="_blank">${esc(v.url)}</a></div>`;
      });
      d.templates.filter(t=>t.url).forEach(t=>{
        html+=`<div class="report-link-row"><span class="report-link-label">${esc(t.label||'Template')}</span><a href="${esc(t.url)}" class="report-link" target="_blank">${esc(t.url)}</a></div>`;
      });
      html+=`</div>`;
    }

    if(d.obs) html+=`<div class="report-section-label" style="margin-top:18px">Observações</div><div class="report-obs">${esc(d.obs)}</div>`;
    html+=`</div>`;
  });

  document.getElementById('report-weekly-content').innerHTML=html;
  document.getElementById('report-semanal-form').style.display='none';
  document.getElementById('report-semanal-output').style.display='block';
  window.scrollTo(0,0);
}

function backToWeeklyForm(){
  document.getElementById('report-semanal-form').style.display='block';
  document.getElementById('report-semanal-output').style.display='none';
  window.scrollTo(0,0);
}

function copyWeekly(){
  const el=document.getElementById('report-weekly-content');
  if(navigator.clipboard&&window.ClipboardItem){
    const blob=new Blob([el.outerHTML],{type:'text/html'});
    const blobText=new Blob([el.innerText],{type:'text/plain'});
    navigator.clipboard.write([new ClipboardItem({'text/html':blob,'text/plain':blobText})]).then(()=>{
      showWeeklyCopyFeedback();
    }).catch(()=>selectAndCopyEl(el));
  } else { selectAndCopyEl(el); }
}

function selectAndCopyEl(el){
  const range=document.createRange();
  range.selectNode(el);
  const sel=window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  document.execCommand('copy');
  sel.removeAllRanges();
  showWeeklyCopyFeedback();
}

function showWeeklyCopyFeedback(){
  const btn=document.querySelector('.btn-copy-report');
  const orig=btn.textContent;
  btn.textContent='✓ Copiado!';
  setTimeout(()=>btn.textContent=orig,2000);
}
